# A3b.2 SOURCE ONLY. Cannot build until separate Owner BUILD permit.
# No Codex, Host/DDEV installation, model, signing or provenance acceptance.
name: PCP-local inspect OCI - manual permit only

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pcp-local-inspect-image-singleton
  cancel-in-progress: false

jobs:
  inspect-image-build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'sonvhse06072/personal-coding-platform' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'sonvhse06072' &&
      github.run_attempt == 1 &&
      vars.PCP_LOCAL_INSPECT_BUILD_WORKFLOW_SHA == github.sha &&
      vars.PCP_LOCAL_INSPECT_BUILD_DECISION == 'DEC-PCP-B2-F3-815-A3B2-OCI-BUILD-ONEUSE-V1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify authorized ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          test "${GITHUB_REPOSITORY:-}" = sonvhse06072/personal-coding-platform
          test "${GITHUB_REF:-}" = refs/heads/main
          test "${GITHUB_RUN_ATTEMPT:-}" = 1
      - name: Checkout frozen source, never mutable main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sonvhse06072/personal-coding-platform
          ref: e15aced199e180d919b5fd4a6c89bcf438d70a51
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify immutable source and restrictive build recipe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e15aced199e180d919b5fd4a6c89bcf438d70a51
          test "$(git rev-parse 'HEAD^{tree}')" = fd77542580bc148c8e2ed0bdce79fea22a290023
          test "$(git rev-parse 'HEAD:services/runtime/app')" = 7e667d28fea0a106280c880ed7ece6029e4e62af
          test -z "$(git status --porcelain)"
          printf '%s\n' \
            'bace204f3fae06449981d7e90a5bd90e789e456e5f2abee6bfb0856555aff70b  profiles/pcp-local/runtime/Dockerfile.inspect' \
            '63361fbbe8b76e25c080ff86954822301439c62a5ea5635f865001814ce49ff7  profiles/pcp-local/runtime/requirements-inspect.lock' \
            '6e11a0630b755dcb3a5b027308ae0964642dc1d316217714388c4f843602af5e  profiles/pcp-local/runtime/Dockerfile.inspect.dockerignore' \
            | sha256sum --check --status
          test "$(git ls-files services/runtime/app | wc -l | tr -d ' ')" = 100
          test "$(git ls-files | wc -l | tr -d ' ')" = 613
      - name: Use pinned BuildKit on ephemeral hosted runner
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
            network=bridge
          buildkitd-flags: --oci-worker-net bridge
      - name: Authenticate only to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push health-only image and OCI metadata
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./profiles/pcp-local/runtime/Dockerfile.inspect
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sonvhse06072/pcp-local-runtime-inspect:source-e15aced199e180d919b5fd4a6c89bcf438d70a51
          no-cache: true
          pull: true
          provenance: mode=max
          sbom: true
      - name: Record digest only, never promote provenance to acceptance
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "PCP_A3B2_IMAGE_DIGEST=$IMAGE_DIGEST"
          echo "PCP_A3B2_AUTHENTICATED_PROVENANCE=NOT_ATTESTED"
          echo "PCP_A3B2_DDEV_INSTALL=STOP"
          echo "PCP_A3B2_CODEX_LIVE=STOP"
