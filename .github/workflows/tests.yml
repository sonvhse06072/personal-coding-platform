name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    # Untrusted PR code uses an ephemeral VM; trusted main uses the old runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/router
          - services/runtime
          - services/ddev-executor
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Check disposable PR runner
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
      - name: Determine safe PR test scope from trusted main base
        id: scope
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          # A PR may edit scripts/ci_pr_scope.py. Never execute its version
          # when deciding whether the PR's own service tests can be skipped.
          # Base SHA is the event's trusted repository main commit.
          if [[ "$PR_BASE_REF" != "main" || "$PR_BASE_REPO" != "$GITHUB_REPOSITORY" ||
                ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null)" || base=""
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          trusted_classifier="$RUNNER_TEMP/pcp-main-ci-pr-scope.py"
          if ! git show "$PR_BASE_SHA:scripts/ci_pr_scope.py" > "$trusted_classifier"; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          evidence="$RUNNER_TEMP/pcp-pr-name-status.bin"
          scoped="$RUNNER_TEMP/pcp-ci-scope-result.txt"
          if git diff --no-ext-diff --no-textconv --no-renames --name-status -z "$base" "$PR_HEAD_SHA" > "$evidence" &&
             python3 "$trusted_classifier" --diff-file "$evidence" --output "$scoped" &&
             [[ "$(cat "$scoped")" == "mode=docs_only" ]]; then
            echo 'mode=docs_only' >> "$GITHUB_OUTPUT"
          else
            # Any unavailable or untrusted evidence must run every service.
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs_only'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt
      - name: Install test dependencies
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs_only'
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs_only'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ROUTER_MODELS_FILE: ${{ github.workspace }}/config/models.yml
          ROUTER_POLICY_FILE: ${{ github.workspace }}/config/routing-policy.yml
          ROUTER_PROJECTS_FILE: ${{ github.workspace }}/config/projects.yml
          PROJECTS_FILE: ${{ github.workspace }}/config/projects.yml
          MODELS_FILE: ${{ github.workspace }}/config/models.yml
          ROUTER_API_TOKEN: test-router-token
          RUNTIME_API_TOKEN: test-runtime-token
          PLATFORM_INTERNAL_TOKEN: test-internal-token
        run: python -m pytest -q -p no:cacheprovider
      - name: T1/T3 document-only PR - service suite not applicable
        if: github.event_name == 'pull_request' && steps.scope.outputs.mode == 'docs_only'
        run: echo 'Only T1/T3 Markdown changed; always-on root structure/doc authority still required.'

  structure-tests:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check disposable PR runner
        if: github.event_name == 'pull_request'
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Enforce direct-PM documentation authority from trusted main base
        if: github.event_name == 'pull_request'
        env:
          DOC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOC_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DOC_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          DOC_PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          # A PR cannot replace its own document/approval policy checker.
          [[ "$DOC_BASE_REF" == "main" && "$DOC_BASE_REPO" == "$GITHUB_REPOSITORY" ]]
          [[ "$DOC_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$DOC_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          trusted_authority="$RUNNER_TEMP/pcp-main-doc-authority.py"
          git show "$DOC_BASE_SHA:scripts/check_project_doc_authority.py" > "$trusted_authority"
          python3 "$trusted_authority" --base "$DOC_BASE_SHA" --head "$DOC_HEAD_SHA" --repo-root "$GITHUB_WORKSPACE"
      - run: python -m pytest -q -p no:cacheprovider tests
