name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/router
          - services/runtime
          - services/ddev-executor
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ROUTER_MODELS_FILE: ${{ github.workspace }}/config/models.yml
          ROUTER_POLICY_FILE: ${{ github.workspace }}/config/routing-policy.yml
          ROUTER_PROJECTS_FILE: ${{ github.workspace }}/config/projects.yml
          PROJECTS_FILE: ${{ github.workspace }}/config/projects.yml
          MODELS_FILE: ${{ github.workspace }}/config/models.yml
          ROUTER_API_TOKEN: test-router-token
          RUNTIME_API_TOKEN: test-runtime-token
          PLATFORM_INTERNAL_TOKEN: test-internal-token
        run: python -m pytest -q -p no:cacheprovider

  structure-tests:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7'
      - run: python -m pytest -q -p no:cacheprovider tests
