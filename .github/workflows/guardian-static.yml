name: guardian-static

on:
  pull_request:
    paths:
      - 'scripts/pcp_guardian.py'
      - 'config/guardian.json'
      - '.github/workflows/pcp-guardian.yml'
      - '.github/workflows/guardian-static.yml'
      - 'tests/test_pcp_guardian.py'

permissions:
  contents: read

jobs:
  guardian-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q -p no:cacheprovider tests/test_pcp_guardian.py
