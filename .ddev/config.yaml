name: personal-coding-platform
type: php
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
database:
  type: postgres
  version: "17"
use_dns_when_possible: true
composer_version: "2"
web_environment:
  - PLATFORM_RUNNING_IN_DDEV=1

hooks:
  pre-start:
    - exec-host: "bash ./scripts/with-host-secrets.sh ./scripts/antigravity-bridge.sh start"
  post-stop:
    - exec-host: "bash ./scripts/with-host-secrets.sh ./scripts/antigravity-bridge.sh stop"
