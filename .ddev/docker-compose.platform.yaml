services:
  router:
    container_name: ddev-${DDEV_SITENAME}-router
    image: personal-coding-platform-router:local
    restart: "no"
    environment:
      ROUTER_MODELS_FILE: /config/models.yml
      ROUTER_POLICY_FILE: /config/routing-policy.yml
      ROUTER_PROJECTS_FILE: /config/projects.yml
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8090:8090
      HTTPS_EXPOSE: 8091:8090
    expose:
      - "8090"
    volumes:
      - ${DDEV_APPROOT}/config:/config:ro
    depends_on:
      db:
        condition: service_started
    x-ddev:
      describe-url-port: 8091
      describe-info: "Model/router decision API"

  coding-runtime:
    container_name: ddev-${DDEV_SITENAME}-coding-runtime
    image: personal-coding-platform-coding-runtime:local
    restart: "no"
    user: "${DDEV_UID}:${DDEV_GID}"
    environment:
      HOME: /home/coder
      ROUTER_URL: http://router:8090
      DDEV_EXECUTOR_URL: http://ddev-executor:8790
      PROJECTS_FILE: /config/projects.yml
      MODELS_FILE: /config/models.yml
      CODING_PROJECTS_ROOT: ${CODING_PROJECTS_ROOT}
      CODING_WORKSPACES_ROOT: ${CODING_WORKSPACES_ROOT}
      DATABASE_URL: postgresql://db:db@db:5432/db
      ANTIGRAVITY_BRIDGE_URL: http://host.docker.internal:${ANTIGRAVITY_BRIDGE_PORT:-8792}
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8787:8787
      HTTPS_EXPOSE: 8788:8787
    expose:
      - "8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount project/workspace roots at the exact same host absolute paths. This
      # keeps isolated job workspace paths identical on host and in containers.
      - ${CODING_WORKSPACES_ROOT}:${CODING_WORKSPACES_ROOT}
      # Reuse host logins for subscription-backed CLIs.
      - ${HOST_HOME}/.codex:/home/coder/.codex
      - ${HOST_HOME}/.config/opencode:/home/coder/.config/opencode
      - ${HOST_HOME}/.local/share/opencode:/home/coder/.local/share/opencode
      - ${HOST_HOME}/.gitconfig:/home/coder/.gitconfig:ro
      - ${DDEV_APPROOT}/config:/config:ro
    depends_on:
      router:
        condition: service_started
      ddev-executor:
        condition: service_started
      db:
        condition: service_healthy
    x-ddev:
      describe-url-port: 8788
      describe-info: "Coding runtime/job API"

  ddev-executor:
    container_name: ddev-${DDEV_SITENAME}-ddev-executor
    user: "${DDEV_UID}:${DDEV_GID}"
    group_add:
      - "${DOCKER_GID}"
    image: personal-coding-platform-ddev-executor:local
    restart: "no"
    environment:
      PROJECTS_FILE: /config/projects.yml
      CODING_PROJECTS_ROOT: ${CODING_PROJECTS_ROOT}
      CODING_WORKSPACES_ROOT: ${CODING_WORKSPACES_ROOT}
      DDEV_COMMAND_TIMEOUT_SECONDS: 1800
      CONTINUITY_GITHUB_REPOSITORY: ${CONTINUITY_GITHUB_REPOSITORY:-sonvhse06072/personal-coding-platform}
      CONTINUITY_BASE_BRANCH: ${CONTINUITY_BASE_BRANCH:-main}
      PCP_BUILDX_BUILDER: pcp-builder
      PCP_BUILDX_CONFIG: /home/coder/.pcp-buildx
      HOME: /home/coder
    expose:
      - "8790"
    volumes:
      # High-privilege service: only this constrained API sees Docker socket and
      # the GitHub delivery credential; coding-runtime/agents never receive it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODING_PROJECTS_ROOT}:${CODING_PROJECTS_ROOT}
      - ${CODING_WORKSPACES_ROOT}:${CODING_WORKSPACES_ROOT}
      - ${HOST_HOME}/.ddev:/home/coder/.ddev
      # Persist only PCP Buildx instance metadata. Do not expose ~/.docker or
      # host registry credentials to the executor container.
      - ${HOST_HOME}/.coding-platform/buildx:/home/coder/.pcp-buildx
      - ${HOST_HOME}/.gitconfig:/home/coder/.gitconfig:ro
      - ${DDEV_APPROOT}/config:/config:ro
    x-ddev:
      describe-info: "Constrained DDEV/GitHub executor (internal only)"

  n8n:
    container_name: ddev-${DDEV_SITENAME}-n8n
    image: ${N8N_IMAGE:-n8nio/n8n:2.38.6}
    restart: "no"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: db
      DB_POSTGRESDB_USER: db
      DB_POSTGRESDB_PASSWORD: db
      N8N_HOST: ${DDEV_HOSTNAME}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${DDEV_HOSTNAME}:5679
      WEBHOOK_URL: https://${DDEV_HOSTNAME}:5679/
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 5678:5678
      HTTPS_EXPOSE: 5679:5678
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      RUNTIME_INTERNAL_URL: http://coding-runtime:8787
    expose:
      - "5678"
    depends_on:
      db:
        condition: service_healthy
      coding-runtime:
        condition: service_started
    volumes:
      - n8n-data:/home/node/.n8n
      - ${DDEV_APPROOT}/n8n/workflows:/opt/pcp-workflows:ro
    x-ddev:
      describe-url-port: 5679
      describe-info: "Thin n8n control plane (Runtime only)"

volumes:
  n8n-data:
