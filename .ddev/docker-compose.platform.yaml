services:
  router:
    container_name: ddev-${DDEV_SITENAME}-router
    build:
      context: ${DDEV_APPROOT}/services/router
    restart: "no"
    environment:
      ROUTER_API_TOKEN: ${ROUTER_API_TOKEN}
      ROUTER_MODELS_FILE: /config/models.yml
      ROUTER_POLICY_FILE: /config/routing-policy.yml
      ROUTER_PROJECTS_FILE: /config/projects.yml
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8090:8090
      HTTPS_EXPOSE: 8091:8090
    expose:
      - "8090"
    volumes:
      - ${DDEV_APPROOT}/config:/config:ro
    depends_on:
      db:
        condition: service_started
    x-ddev:
      describe-url-port: 8091
      describe-info: "Model/router decision API"

  coding-runtime:
    container_name: ddev-${DDEV_SITENAME}-coding-runtime
    build:
      context: ${DDEV_APPROOT}/services/runtime
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        GEMINI_CLI_VERSION: ${GEMINI_CLI_VERSION:-latest}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
        DDEV_UID: ${DDEV_UID}
        DDEV_GID: ${DDEV_GID}
    restart: "no"
    user: "${DDEV_UID}:${DDEV_GID}"
    environment:
      HOME: /home/coder
      ROUTER_URL: http://router:8090
      ROUTER_API_TOKEN: ${ROUTER_API_TOKEN}
      RUNTIME_API_TOKEN: ${RUNTIME_API_TOKEN}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN}
      DDEV_EXECUTOR_URL: http://ddev-executor:8790
      PROJECTS_FILE: /config/projects.yml
      MODELS_FILE: /config/models.yml
      CODING_PROJECTS_ROOT: ${CODING_PROJECTS_ROOT}
      CODING_WORKSPACES_ROOT: ${CODING_WORKSPACES_ROOT}
      DATABASE_URL: postgresql://db:db@db:5432/db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8787:8787
      HTTPS_EXPOSE: 8788:8787
    expose:
      - "8787"
    volumes:
      # Mount project/workspace roots at the exact same host absolute paths. This
      # keeps isolated job workspace paths identical on host and in containers.
      - ${CODING_WORKSPACES_ROOT}:${CODING_WORKSPACES_ROOT}
      # Reuse host logins for subscription-backed CLIs.
      - ${HOST_HOME}/.codex:/home/coder/.codex
      - ${HOST_HOME}/.gemini:/home/coder/.gemini
      - ${HOST_HOME}/.config/opencode:/home/coder/.config/opencode
      - ${HOST_HOME}/.local/share/opencode:/home/coder/.local/share/opencode
      - ${HOST_HOME}/.gitconfig:/home/coder/.gitconfig:ro
      - ${DDEV_APPROOT}/config:/config:ro
    depends_on:
      router:
        condition: service_started
      ddev-executor:
        condition: service_started
      db:
        condition: service_healthy
    x-ddev:
      describe-url-port: 8788
      describe-info: "Coding runtime/job API"

  ddev-executor:
    container_name: ddev-${DDEV_SITENAME}-ddev-executor
    user: "${DDEV_UID}:${DDEV_GID}"
    group_add:
      - "${DOCKER_GID}"
    build:
      context: ${DDEV_APPROOT}/services/ddev-executor
      args:
        DDEV_VERSION: ${DDEV_EXECUTOR_VERSION:-v1.25.4}
        BUILDX_VERSION: ${DDEV_EXECUTOR_BUILDX_VERSION:-v0.37.0}
        DDEV_UID: ${DDEV_UID}
        DDEV_GID: ${DDEV_GID}
    restart: "no"
    environment:
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN}
      PROJECTS_FILE: /config/projects.yml
      CODING_PROJECTS_ROOT: ${CODING_PROJECTS_ROOT}
      CODING_WORKSPACES_ROOT: ${CODING_WORKSPACES_ROOT}
      DDEV_COMMAND_TIMEOUT_SECONDS: 1800
      HOME: /home/coder
    expose:
      - "8790"
    volumes:
      # High-privilege service: only this constrained API sees Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODING_PROJECTS_ROOT}:${CODING_PROJECTS_ROOT}
      - ${CODING_WORKSPACES_ROOT}:${CODING_WORKSPACES_ROOT}
      - ${HOST_HOME}/.ddev:/home/coder/.ddev
      - ${HOST_HOME}/.gitconfig:/home/coder/.gitconfig:ro
      - ${DDEV_APPROOT}/config:/config:ro
    x-ddev:
      describe-info: "Constrained DDEV executor (internal only)"

  n8n:
    container_name: ddev-${DDEV_SITENAME}-n8n
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    restart: "no"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: db
      DB_POSTGRESDB_USER: db
      DB_POSTGRESDB_PASSWORD: db
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DDEV_HOSTNAME}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${DDEV_HOSTNAME}:5679
      WEBHOOK_URL: https://${DDEV_HOSTNAME}:5679/
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 5678:5678
      HTTPS_EXPOSE: 5679:5678
      ROUTER_INTERNAL_URL: http://router:8090
      RUNTIME_INTERNAL_URL: http://coding-runtime:8787
      ROUTER_API_TOKEN: ${ROUTER_API_TOKEN}
      RUNTIME_API_TOKEN: ${RUNTIME_API_TOKEN}
    expose:
      - "5678"
    depends_on:
      db:
        condition: service_healthy
      coding-runtime:
        condition: service_started
    volumes:
      - n8n-data:/home/node/.n8n
    x-ddev:
      describe-url-port: 5679
      describe-info: "n8n control plane"

volumes:
  n8n-data:
