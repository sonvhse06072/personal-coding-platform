version: 1
projects:
  default:
    path: ${CODING_PROJECTS_ROOT}/example-project
    base_branch: main
    privacy:
      private_code: true
      allow_training_provider: true
      require_zero_retention: false
    human_policy:
      routine_review: false
      important_decisions_only: true
    autonomy:
      allow_commit: true
      allow_push_ai_branch: true
      allow_create_pr: true
      allow_auto_merge_low_risk: true
      allow_production_deploy: false
    runtime:
      branch_prefix: ai
      max_diff_bytes: 500000
      keep_workspace_on_success: true
      keep_workspace_on_failure: true
    ddev:
      enabled: true
      verification_phase_capabilities:
        targeted_tests:
          requires:
            - php_runtime
        static_analysis:
          requires:
            - php_runtime
      preflight:
      - ddev start -y
      targeted_tests:
      - ddev exec vendor/bin/phpcs web/modules/custom || true
      static_analysis:
      - ddev exec vendor/bin/phpstan analyse || true
      full_tests: []
      cleanup:
      - ddev stop --unlist --omit-snapshot
  example-drupal:
    path: ${CODING_PROJECTS_ROOT}/example-drupal
    base_branch: develop
    privacy:
      private_code: true
      allow_training_provider: true
      require_zero_retention: false
    human_policy:
      routine_review: false
      important_decisions_only: true
    autonomy:
      allow_commit: true
      allow_push_ai_branch: true
      allow_create_pr: true
      allow_auto_merge_low_risk: true
      allow_production_deploy: false
    runtime:
      branch_prefix: ai
      workspace_mode: direct
      exclusive_project_lease: true
      developer_permission_mode: trusted_local
      max_diff_bytes: 750000
      keep_workspace_on_success: true
      keep_workspace_on_failure: true
    ddev:
      enabled: true
      verification_phase_capabilities:
        targeted_tests:
          requires:
            - php_runtime
        static_analysis:
          requires:
            - php_runtime
        full_tests:
          requires:
            - php_runtime
      preflight:
      - ddev start -y
      - ddev drush cr
      targeted_tests:
      - ddev exec vendor/bin/phpcs web/modules/custom
      static_analysis:
      - ddev exec vendor/bin/phpstan analyse web/modules/custom
      full_tests:
      - ddev exec vendor/bin/phpunit
      cleanup:
      - ddev stop --unlist --omit-snapshot
  pcp-validation-fixture:
    path: ${CODING_PROJECTS_ROOT}/pcp-validation-fixture
    base_branch: main
    privacy:
      private_code: true
      allow_training_provider: true
      require_zero_retention: false
    human_policy:
      routine_review: false
      important_decisions_only: true
    autonomy:
      allow_commit: true
      allow_push_ai_branch: true
      allow_create_pr: true
      allow_auto_merge_low_risk: true
      allow_production_deploy: false
    runtime:
      branch_prefix: ai
      max_diff_bytes: 100000
      keep_workspace_on_success: true
      keep_workspace_on_failure: true
    ddev:
      enabled: true
      verification_phase_capabilities:
        targeted_tests:
          requires:
            - php_runtime
        static_analysis:
          requires:
            - php_runtime
        full_tests:
          requires:
            - php_runtime
      preflight:
      - ddev start -y
      targeted_tests:
      - ddev exec php tools/check-style.php
      static_analysis:
      - >-
        ddev exec sh -lc 'find web tests tools -type f -name "*.php" -print0 | xargs -0 -n1 php -l'
      full_tests:
      - ddev exec php tools/run-tests.php
      cleanup:
      - ddev stop --unlist --omit-snapshot
  chonhac:
    path: /home/sonvh/chonhac
    base_branch: main

    privacy:
      private_code: true
      allow_training_provider: true
      require_zero_retention: false

    human_policy:
      routine_review: false
      important_decisions_only: true

    autonomy:
      allow_commit: true
      allow_push_ai_branch: true
      allow_create_pr: true
      allow_auto_merge_low_risk: true
      allow_production_deploy: false

    runtime:
      branch_prefix: ai
      workspace_mode: direct
      exclusive_project_lease: true
      max_diff_bytes: 750000
      keep_workspace_on_success: true
      keep_workspace_on_failure: true

    preview:
      backend:
        enabled: true
        url: https://chonhac.ddev.site
      frontend:
        enabled: true
        directory: frontend
        prepare:
          - >-
            ddev exec bash -lc 'cd frontend && node --version && npm ci --no-audit --no-fund'
        daemon:
          name: pcp-next-dev
          command: ./node_modules/.bin/next dev --hostname 0.0.0.0 --port 3100
          directory: /var/www/html/frontend
          container_port: 3100
          http_port: 3099
          https_port: 3100
        url: https://chonhac.ddev.site:3100
        api_origin_on_both: https://chonhac.ddev.site

    ddev:
      enabled: true
      workspace_nodejs_version: "24"

      auto_required_phases:
        - phase: frontend_quality
          path_prefixes:
            - frontend/

      verification_phase_capabilities:
        targeted_tests:
          requires:
            - php_runtime
        static_analysis:
          requires:
            - php_runtime
        frontend_quality:
          requires:
            - local_listener

      preflight:
        - ddev start -y
        - ddev composer install --no-interaction

      targeted_tests:
        - ddev drush cr
        - >-
          ddev exec bash -lc 'find web/modules/custom -type f -path "*/tests/src/Unit/*Test.php" -print0 | xargs -0 -r vendor/bin/phpunit -c web/core/phpunit.xml.dist'
        - >-
          ddev exec bash -lc 'SIMPLETEST_DB=pgsql://db:db@db:5432/db vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/cho_nhac_show/tests/src/Kernel/ShowDomainTest.php'

      static_analysis:
        - ddev exec vendor/bin/phpcs web/modules/custom

      frontend_quality:
        - ddev start -y
        - >-
          ddev exec bash -lc 'cd frontend && node --version && npm ci --no-audit --no-fund'
        - ddev exec bash -lc 'cd frontend && npm run typecheck'
        - ddev exec bash -lc 'cd frontend && npm run lint'
        - ddev exec bash -lc 'cd frontend && npm test'
        - >-
          ddev exec bash -lc 'cd frontend && NEXT_TELEMETRY_DISABLED=1 npm run build'
        - >-
          ddev exec -u root bash -lc 'cd /var/www/html/frontend && npx playwright install-deps chromium'
        - >-
          ddev exec bash -lc 'cd frontend && npx playwright install chromium'
        - >-
          ddev exec bash -lc 'cd frontend && NEXT_TELEMETRY_DISABLED=1 npm run test:browser'

      full_tests: []

      cleanup:
        - ddev stop --unlist --omit-snapshot
