version: 20
complexity_weights:
  scope: 0.18
  dependency_depth: 0.1
  ambiguity: 0.14
  architecture_impact: 0.14
  verification_difficulty: 0.1
  risk: 0.12
  context_requirement: 0.1
  novelty: 0.07
  reasoning_requirement: 0.05
adaptive_budget:
  enabled: true
  # Profile values are planning priors, not Human Owner continuation gates.
  # Estimate/working/emergency thresholds remain telemetry for cumulative token,
  # call/tool/test/iteration/repair and total-wall dimensions on effective
  # adaptive WorkOrders. Hard monetary cost, provider quota/context enforcement,
  # scope/anomaly/protected boundaries and per-operation timeouts remain
  # independently fail-closed. Changed-file count is an adaptive work-shape
  # signal with a bounded emergency ceiling; sensitive changed paths remain
  # independent protected-decision gates.
  estimate_min_ratio: 0.65
  estimate_max_ratio: 1.35
  working_headroom_ratio: 1.25
  dimensions:
    max_model_calls:
      minimum: 2
      hard_max: 40
    max_input_tokens:
      minimum: 250000
      hard_max: 8000000
    max_output_tokens:
      minimum: 40000
      hard_max: 1000000
    max_tool_calls:
      minimum: 10
      hard_max: 400
    max_iterations:
      minimum: 2
      hard_max: 24
    max_repair_iterations:
      minimum: 1
      hard_max: 12
    max_test_runs:
      minimum: 2
      hard_max: 40
    max_wall_time_minutes:
      minimum: 10
      hard_max: 180
    max_changed_files:
      minimum: 2
      hard_max: 90
telemetry_calibration:
  # Historical evidence may refine an estimate only after a meaningful sample.
  # It never expands adaptive-budget hard maxima or protected decision policy.
  minimum_sample_size: 5
  multiplier_min: 0.75
  multiplier_max: 1.75
review_policy:
  # PCP #562 Owner-approved fallback is *not* cross-provider independence.
  # Used only for one late, exact-head PM merge recovery after explicitly
  # confirmed cross-provider reviewer capacity is unavailable.
  late_review_recovery:
    same_provider_higher_tier_fallback_enabled: true
  # Review spend is policy/calibration data, not a model identity decision.
  # Router still staffs the logical reviewer role from current provider/model
  # eligibility and Runtime remains responsible for deterministic acceptance.
  profiles:
    fast:
      level: lightweight
      required: false
      conditional_on_strong_evidence: true
      independent: true
      different_model_required: true
      different_provider_required: false
      reason: routine work skips model review only when deterministic evidence is strong
    standard:
      level: standard
      required: true
      conditional_on_strong_evidence: false
      independent: true
      different_model_required: false
      different_provider_required: false
      reason: standard profile requires bounded independent Task Contract/diff review
    complex:
      level: strong
      required: true
      conditional_on_strong_evidence: false
      independent: true
      different_model_required: true
      different_provider_required: false
      reason: complex profile requires a stronger independent reviewer
    critical:
      level: critical
      required: true
      conditional_on_strong_evidence: false
      independent: true
      different_model_required: true
      different_provider_required: true
      reason: critical profile requires cross-provider review when eligible
  high_impact:
    architecture_impact_min: 70
    risk_min: 85
    flags:
    - security_sensitive
    - security_boundary_change
    - authentication_change
    - authorization_change
    - secret_management_change
    policy:
      level: critical
      required: true
      conditional_on_strong_evidence: false
      independent: true
      different_model_required: true
      different_provider_required: true
      reason: security/architecture/high-risk work requires cross-provider review when eligible
