    preferred_ids:
    - codex_gpt61_sol
    - antigravity_gemini_pro
    - codex_gpt6_sol
    - codex_terra
    - antigravity_claude_sonnet
    - codex_sol
    - antigravity_free
critical_triggers:
- destructive_migration
- production_write
- branch_protection_change
- secret_management_change
human_decision_triggers:
- architecture_choice
- product_ambiguity_high_impact
- destructive_migration
- production_write
- major_dependency_addition
- security_boundary_change
- budget_exhausted_with_decision
minimum_profile_overrides:
  security_sensitive: complex
  schema_change: complex
  authentication_change: critical
  authorization_change: critical
  production_write: critical
  destructive_migration: critical
scoring:
  capability_weight: 0.52
  predicted_success_weight: 0.3
  preferred_order_bonus: 0.08
  free_cost_bonus: 0.06
  subscription_cost_bonus: 0.04
  ultra_low_cost_bonus: 0.03
  premium_cost_penalty: 0.04
  scarce_cost_penalty: 0.1
  quota_pressure_penalty: 0.12
  # Preserve a small provider allowance reserve instead of assigning new work
  # to a bucket that is technically non-zero but operationally exhausted.
  # quota_pressure is normalized 0..1, so 0.99 means >=99% used.
  quota_near_exhaustion_threshold: 0.99
  error_rate_penalty: 0.12
  latency_penalty: 0.03
  unhealthy_penalty: 1.0
  fallback_unknown_success: 0.7
anti_loop:
  same_failure_fingerprint_limit: 2
  no_progress_iterations: 2
  diff_oscillation_limit: 2
  scope_growth_ratio: 2.0
  # Review-repair epochs are request-scoped anomaly windows. They do not reset
  # cumulative progress and are independent from adaptive planning budgets.
  review_repair_max_repair_cycles: 6
  review_repair_max_verification_cycles: 8
  escalation_monotonic: true
  escalation_resets_budget: false
